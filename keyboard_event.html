<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Keyboard Event</title>

    <style>
        body {
            font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
            background-color: darksalmon;
        }

        #form {
            width: 300px;
            margin: 100px auto 0 auto;
            border: 2px solid royalblue;
            border-radius: 15px;
            padding: 15px;
            background-color: cornflowerblue;
            color: darkseagreen;
            box-shadow: -3px 3px 10px #000;
        }

        p,
        input {
            font-size: 20px;
        }

        input {
            width: 100%;
            box-sizing: border-box;
            border: 1px solid #000;
            border-radius: 10px;
            background-color: darkseagreen;
            box-shadow: inset -3px 3px 10px #000;
        }
    </style>
</head>

<body>

    <!-- Send alert on every key press -->
    <!--
    <div id="form">
        <h1 id="h1">Keyboard Events</h1>

        <p>onkeydown</p>
        <input type="text" onkeydown="alert(this.value)">

        <p>onkeyup</p>
        <input type="text" onkeyup="alert(this.value)">

        <p>onkeypress</p>
        <input type="text" onkeypress="alert(this.value)">
    </div>
    -->


    <!-- Change form background according to input -->
    <div id="form">

        <h1 id="h1">Keyboard Events</h1>

        <p>onkeydown</p>
        <input type="text"
               onkeydown="document.getElementById('form').style.backgroundColor = this.value">

        <p>onkeyup</p>
        <input type="text"
               onkeyup="document.getElementById('form').style.backgroundColor = this.value">

        <p>onkeypress</p>
        <input type="text"
               onkeypress="document.getElementById('form').style.backgroundColor = this.value">

    </div>

</body>
</html>
