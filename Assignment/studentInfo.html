<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STUDENT INFORMATION SYSTEM</title>
</head>
<body>
    <header>
        <h1>STUDENT INFORMATION SYSTEM</h1>
        <p>Studnet Managment System In JavaScript Using Function</p>
    </header>

    <div class="container">
        <h2>Enter Student Information</h2>
        <div class="form">
            <input type="number" id="studentId" placeholder="Student ID">
            <input type="text" id="studentName" placeholder="Student Name">
            <input type="text" id="fatherName" placeholder="Father's Name">
            <input type="text" id="course" placeholder="Course">
            <input type="number" id="semester" placeholder="Semester">
            <input type="text" id="section" placeholder="Section">
            <input type="email" id="email" placeholder="Email">
            <input type="number" id="phone" placeholder="Phone Number">
            <input type="number" id="marks" placeholder="Marks">
            <input type="number" id="attendance" placeholder="Attendance %">
        </div>
        <div class="button">
            <button onclick="addStudent()">Add Student</button>
            <button onclick="displayStudents()">Display Students</button>
            <button onclick="searchStudent()">Search Student</button>
            <button onclick="updateStudent()">Update Student</button>
            <button onclick="deleteStudent()">Delete Student</button>
            <button onclick="clearForm()">Clear</button>
        </div>

    </div>
</body>
</html>
