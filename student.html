<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Management System</title>
    <style>
        body{
            font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color:darksalmon;
        }
        .container{
            width:600px;
            margin:40px auto;
            height:600px;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px green;
        }
        h1{
            text-align:center;
        }
        input{
            width:95%;
            padding:10px;
            margin: 8px 0;
        }
        button{
            padding: 10px 15px;
            margin: 10px 5px;
            cursor:pointer;
        }
        table{
            width:100%;
            border-collapse: collapse;
            margin-top:20px;
        }
        table,th,td{
            border: 1px solid black;
        }
        th,td{
            padding:10px;
            text-align:center;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>CSE-DS Student Management System</h1>
        <input type="text" id="roll" placeholder="Roll Number">
        <input type="text" id="name" placeholder="Name Of Student">
        <input type="text" id="branch" placeholder="Branch">
        <button onclick="SaveData()"Save></button> 
        <button onclick="ShowData()"Retrieve></button>
        <table>
            <thread>
                <tr>
                    <th>Roll Number</th>
                    <th>Name</th>
                    <th>Branch</th>
                </tr>
            </thread>
            <tbody id="tableBody"></tbody>
        </table>
    </div>
    <script src="script.js"></script>
</body>
</html>
