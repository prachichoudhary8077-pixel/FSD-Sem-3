<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSE-DS Student Management System</title>

    <style>
        *{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{

    background-image:url("https://www.abes.ac.in/assets/2.jpg");
    background-size:cover;
    background-position:center;
    background-repeat:no-repeat;
    background-attachment:fixed;

    min-height:100vh;

}

/* Header */

/* ================= HEADER ================= */

header{

    width:95%;

    margin:20px auto;

    display:flex;

    justify-content:space-between;

    align-items:center;

    padding:20px 35px;

    border-radius:18px;

    background:rgba(255,255,255,.15);

    backdrop-filter:blur(15px);

    box-shadow:0 8px 25px rgba(0,0,0,.4);

}

.header-left h1{

    color:white;

    font-size:42px;

    text-shadow:0 0 15px cyan;

}

.header-left p{

    color:#FFD700;

    font-size:22px;

    margin-top:8px;

    font-weight:bold;

}

/* Right Side */

.header-right{

    text-align:right;

}

#adminName{

    color:white;

    font-size:24px;

    font-weight:bold;

    margin-bottom:10px;

}

#adminName span{

    color:white;

    font-weight:bold;

}

#liveTime{

    color:white;

    font-size:24px;

    font-weight:bold;

    margin-bottom:8px;

}

#liveDate{

    color:white;

    font-size:20px;

    font-weight:bold;

}
/* Main Layout */

.dashboard{

    width:95%;
    margin:40px auto;

    display:flex;
    justify-content:space-between;
    align-items:flex-start;

    gap:40px;

}

/* Glass Cards */

.glass-card{

    background:rgba(255,255,255,0.18);

    backdrop-filter:blur(18px);

    -webkit-backdrop-filter:blur(18px);

    border-radius:20px;

    border:1px solid rgba(255,255,255,.3);

    box-shadow:0px 8px 25px rgba(0,0,0,.4);

}

/* Left */

.left-card{

    width:28%;
    padding:25px;

}

.left-card h2{

    color:#fff;

    font-size:30px;

    text-align:center;

    margin-bottom:25px;

    letter-spacing:2px;

    text-transform:uppercase;

    border-bottom:2px solid rgba(255,255,255,.5);

    padding-bottom:10px;

}

#studentForm{

    display:flex;
    flex-direction:column;
    gap:15px;

}

#studentForm input{

    padding:14px;

    border:2px solid rgba(255,255,255,.4);

    background:rgba(255,255,255,.18);

    color:white;

    border-radius:12px;

    outline:none;

    font-size:16px;

    transition:.4s;

}

#studentForm input::placeholder{

    color:#eee;

}

#studentForm input:focus{

    border:2px solid cyan;

    background:rgba(255,255,255,.3);

    box-shadow:0px 0px 15px cyan;

}

#studentForm button{

    padding:15px;

    border:none;

    border-radius:12px;

    font-size:18px;

    font-weight:bold;

    cursor:pointer;

    color:white;

    background:linear-gradient(45deg,#00c6ff,#0072ff);

    transition:.4s;

}

#studentForm button:hover{

    transform:translateY(-4px);

    box-shadow:0px 10px 20px rgba(0,0,0,.4);

}



/* Center */
.center-content{

    width:32%;

    display:flex;

    justify-content:center;

    align-items:center;

    flex-direction:column;

    margin-top:180px;

    position:relative;

}

/* Moving Badge */

.badge{

    position:absolute;

    width:120px;
    height:120px;

    border-radius:50%;

    background:linear-gradient(45deg,#FFD700,#FF8C00,#00C6FF);

    display:flex;
    justify-content:center;
    align-items:center;

    color:white;

    font-size:18px;      /* Pehle 24px tha */

    font-weight:bold;

    letter-spacing:1px;  /* Thoda spacing */

    white-space:nowrap;  /* Hamesha ek line me */

    box-shadow:
        0 0 20px #FFD700,
        0 0 40px #00FFFF;

    animation:
        badgeMove 12s linear infinite,
        badgeGlow 2s ease-in-out infinite alternate;

}

/* WELCOME */

.center-content h1{

    margin-top:140px;

    font-size:90px;

    font-weight:900;

    letter-spacing:8px;

    font-family:'Trebuchet MS', sans-serif;

    color:#ffffff;

    text-transform:uppercase;

    text-shadow:
        0 0 10px cyan,
        0 0 20px cyan,
        0 0 40px cyan,
        4px 4px 10px black;

    animation:welcomeGlow 2s ease-in-out infinite alternate;

}

/* Badge Movement */

@keyframes badgeMove{

    0%{

        transform:translate(-150px,-80px);

    }

    25%{

        transform:translate(170px,-40px);

    }

    50%{

        transform:translate(170px,100px);

    }

    75%{

        transform:translate(-170px,100px);

    }

    100%{

        transform:translate(-150px,-80px);

    }

}

/* Badge Glow */

@keyframes badgeGlow{

    from{

        box-shadow:
            0 0 20px #FFD700,
            0 0 40px orange;

    }

    to{

        box-shadow:
            0 0 30px cyan,
            0 0 60px cyan,
            0 0 90px white;

    }

}

/* Welcome Glow */

@keyframes welcomeGlow{

    from{

        color:white;

        text-shadow:
            0 0 15px cyan,
            0 0 35px cyan,
            0 0 55px cyan,
            4px 4px 10px black;

    }

    to{

        color:#FFD700;

        text-shadow:
            0 0 20px gold,
            0 0 45px gold,
            0 0 70px orange,
            4px 4px 10px black;

    }

}

/* Right */

.right-card{

    width:40%;

    padding:20px;

}

.top{

    display:flex;

    justify-content:space-between;

    align-items:center;

    margin-bottom:20px;

}

.top h2{

    color:white;

    font-size:28px;

    letter-spacing:1px;

    border-bottom:2px solid rgba(255,255,255,.5);

    padding-bottom:10px;

}


.top input{

    padding:12px;

    border-radius:25px;

    border:none;

    background:white;

    width:220px;

}

/* Table */

table{

    width:100%;

    border-collapse:collapse;

}

table th{

    background:#003366;

    color:white;

    padding:12px;

}

table td{

    background:rgba(255,255,255,.85);

    text-align:center;

    padding:12px;

    border:1px solid #ddd;

}

.delete{

    background:red;

    color:white;

    border:none;

    padding:8px 14px;

    border-radius:6px;

    cursor:pointer;

}

.delete:hover{

    background:darkred;

}

/* Responsive */

@media(max-width:1100px){

.dashboard{

    flex-direction:column;

    align-items:center;

}

.left-card,
.center-content,
.right-card{

    width:95%;

}

.center-content{

    margin-top:20px;
    margin-bottom:20px;

}

.top{

    flex-direction:column;

    gap:15px;

}

.top input{

    width:100%;

}

}
    </style>
</head>
<body>

    <!-- Header -->

    <header>

    <div class="header-left">

        <h1>🎓 CSE-DS Student Management System</h1>

        <p>ABES Engineering College</p>

    </div>

    <div class="header-right">

        <div id="adminName">👨‍💻 Admin : <span>Prachi Choudhary</span></div>

        <div id="liveTime"></div>

        <div id="liveDate"></div>

    </div>

</header>



    <!-- Main Dashboard -->

    <div class="dashboard">



        <!-- Left Side Form -->

        <div class="glass-card left-card">

            <h2>Add Student</h2>

            <form id="studentForm">

                <input
                type="text"
                id="name"
                placeholder="Student Name"
                required>

                <input
                type="text"
                id="roll"
                placeholder="Roll Number"
                required>

                <input
                type="email"
                id="email"
                placeholder="Email Address"
                required>

                <input
                type="number"
                id="semester"
                placeholder="Semester"
                required>

                <input
                type="text"
                id="section"
                placeholder="Section"
                required>

                <button type="submit">

                    Add Student

                </button>

            </form>

        </div>



        <!-- Center -->

        <div class="center-content">

    <div class="badge">
        🎓 CSE-DS
    </div>

    <h1>WELCOME</h1>

    

</div>


        <!-- Right Side -->

        <div class="glass-card right-card">

            <div class="top">

                <h2>Student Records</h2>

                <input
                type="text"
                id="search"
                placeholder="Search Student">

            </div>

            <table>

                <thead>

                    <tr>

                        <th>Name</th>

                        <th>Roll</th>

                        <th>Semester</th>

                        <th>Action</th>

                    </tr>

                </thead>

                <tbody id="studentList">

                </tbody>

            </table>

        </div>

    </div>



    <script src="script.js"></script>

</body>
</html>
